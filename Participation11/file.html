<!DOCTYPE html>
<html>
<head>
    <title>OrangeNation</title>
</head>
<body>
    <div id="orangeText">Syracuse University</div>

    <script>
      const text = document.getElementById('orangeText');
      
      text.addEventListener('click', function() {
        text.style.color = 'orange';
        text.innerHTML = 'Orange Nation';
      });
    </script>
</body>
</html>
