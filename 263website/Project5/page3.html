<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" type="image/book-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 3</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function showModal(text) {
            const modal = document.getElementById('imageModal');
            const modalText = document.getElementById('modalText');
            modalText.textContent = text;
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function showNextImage(currentImg) {
            const images = document.querySelectorAll('.adol_images img');
            let currentIndex = Array.from(images).indexOf(currentImg);
            let nextIndex = (currentIndex + 1) % images.length;
            images[nextIndex].scrollIntoView({ 
                behavior: 'smooth', 
                block: 'center' 
            });
        }

     
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="page1.html">Page 1</a></li>
            <li><a href="page2.html">Page 2</a></li>
            <li><a href="page3.html">Page 3</a></li>
            <li><a href="page4.html">Page 4</a></li>
        </ul>
    </nav>
    <header>
        <h1>Adolescence</h1>
        <h2>the bridge between who we were and who we are becoming.</h2>
    </header>
    <main>
        <div id="imageModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <p id="modalText"></p>
            </div>
        </div>
        <div class="adol_images">
            <img src="adol_images/a2.JPG" alt="Adolescent Photo"
                onclick="showModal('Suddenly, I was in high school, and my world shifted dramatically as I moved into boarding school—by far the most significant change I had ever experienced up until that point. Being away from home was hard, but once I found my circle of friends, I started to embrace the newness of it all'); showNextImage(this)">
            <img src="adol_images/a1.jpeg" alt="Adolescent Photo"
                onclick="showModal('When I think back to that time, I don’t even cringe (though I’m not entirely sure what I was thinking with some of my style choices)'); showNextImage(this)">
            <img src="adol_images/a3.jpeg" alt="Adolescent Photo"
                onclick="showModal('What stands out the most from those years is how I learned the value of loyalty and the kind of friendships that would help me weather life’s storms'); showNextImage(this)">
            <img src="adol_images/a9.jpeg" alt="Adolescent Photo"
                onclick="showModal('Then, of course, COVID hit, and my world turned upside down once again. I moved back home for a while, but before long, I found myself back at boarding school for my sophomore year.'); showNextImage(this)">
            <img src="adol_images/a6.PNG" alt="Adolescent Photo"
                onclick="showModal('These days were marked by isolation...'); showNextImage(this)">
            <img src="adol_images/a5.PNG" alt="Adolescent Photo"
                onclick="showModal('Wellness surveys...'); showNextImage(this)">
            <img src="adol_images/a8.jpg" alt="Adolescent Photo"
                onclick="showModal('and the strictest of rules for socializing.'); showNextImage(this)">
            <img src="adol_images/a11.jpeg" alt="Adolescent Photo"
                onclick="showModal('Yet, despite everything, we found a way to make the most of it.'); showNextImage(this)">
            <img src="adol_images/a10.jpeg" alt="Adolescent Photo"
                onclick="showModal(' I forged new friendships, although the group of girls I spent the most time with was very cliquey'); showNextImage(this)">
            <img src="adol_images/a4.jpeg" alt="Adolescent Photo"
                onclick="showModal('We had our moments of fun, but being in that group made me realize something important: while I cherished these friendships, I didn’t want to be boxed into just one set of people. I was craving new connections, new perspectives. I was learning so much about myself, and I wanted a challenge.'); showNextImage(this)">
            <img src="adol_images/a15.jpeg" alt="Adolescent Photo"
                onclick="showModal('And so, in a whirlwind of chaos and rapid changes, I made one of the boldest decisions of my life: I applied for a year-abroad program in Zaragoza, Spain—despite knowing virtually no Spanish beyond the basics of a level 1 class.'); showNextImage(this)">
            <img src="adol_images/a13.JPG" alt="Adolescent Photo"
                onclick="showModal('That summer, I made a new friend group, and saying goodbye to them..'); showNextImage(this)">
            <img src="adol_images/a12.jpeg" alt="Adolescent Photo"
                onclick="showModal('...and my beautiful town at the end of the summer was incredibly tough.'); showNextImage(this)">
            <img src="adol_images/a18.jpeg" alt="Adolescent Photo"
                onclick="showModal(' I was terrified, filled with doubt about what lay ahead. When I first arrived in Spain, I was stunned by the beauty of the city....'); showNextImage(this)">
            <img src="adol_images/a14.jpeg" alt="Adolescent Photo"
                onclick="showModal('...and the rich history that surrounded me.'); showNextImage(this)">
            <img src="adol_images/a19.jpeg" alt="Adolescent Photo"
                onclick="showModal(' I explored as much as I could...'); showNextImage(this)">
            <img src="adol_images/a16.jpeg" alt="Adolescent Photo"
                onclick="showModal('made a few friends...'); showNextImage(this)">
            <img src="adol_images/a7.jpeg" alt="Adolescent Photo"
                onclick="showModal('and marveled at how far I had come!'); showNextImage(this)">
            <img src="adol_images/a28.jpeg" alt="Adolescent Photo"
                onclick="showModal('But that first experience wasn’t easy. My host family and I struggled to communicate, and I spent much of my time feeling alone and unsure.'); showNextImage(this)">
            <img src="adol_images/a20.jpeg" alt="Adolescent Photo"
                onclick="showModal('Things got better when I stayed with a friend’s host family during the winter break, and I began to feel a deep sense of gratitude for their kindness.'); showNextImage(this)">
            <img src="adol_images/a24.jpeg" alt="Adolescent Photo"
                onclick="showModal('They would always wrangle the cat for me to hold when I got back from school after I expressed how comforting it felt to have an animal in the house.'); showNextImage(this)">
            <img src="adol_images/a25.jpg" alt="Adolescent Photo"
                onclick="showModal('The mom made me a handmade gift, and it was in those small, thoughtful moments that I began to appreciate just how much kindness could change a person’s experience.'); showNextImage(this)">
            <img src="adol_images/a22.JPG" alt="Adolescent Photo"
                onclick="showModal('I quickly realized I needed a better host family situation, and with that realization came one of the toughest moments of my trip: confronting my first host family and telling them I wanted to switch. I’ve always hated confrontation, so this wasn’t easy. But once I made the switch, my life improved tenfold.'); showNextImage(this)">
            <img src="adol_images/a29.mp4"  alt="Adolescent Photo"
                onclick="showModal('My new host family—Guillermo, Isabel, and their two adorable children, Daniel and Celia—welcomed me with open arms.'); showNextImage(this)">
            <img src="adol_images/a32.jpeg" alt="Adolescent Photo"
                onclick="showModal('Honorable mention was queso, the hamster who bit me every time I tried to hold him.'); showNextImage(this)">
            <img src="adol_images/a35.jpeg" alt="Adolescent Photo"
                onclick="showModal('In the three short months I spent with them, we traveled together, and they helped me with my Spanish.'); showNextImage(this)">
            <img src="adol_images/a37.jpeg" alt="Adolescent Photo"
                onclick="showModal('I became incredibly close with them...'); showNextImage(this)">
            <img src="adol_images/a30.jpg" alt="Adolescent Photo"
                onclick="showModal('And the more I embraced this new life, the more I felt myself growing.'); showNextImage(this)">
            <img src="adol_images/a27.jpg" alt="Adolescent Photo"
                onclick="showModal('I also threw myself into cultural activities...'); showNextImage(this)">
            <img src="adol_images/a26.jpeg" alt="Adolescent Photo"
                onclick="showModal('..Traveled across Spain...'); showNextImage(this)">
            <img src="adol_images/a21.jpeg" alt="Adolescent Photo"
                onclick="showModal('And bonded with my classmates.'); showNextImage(this)">
            <img src="adol_images/a34.jpg" alt="Adolescent Photo"
                onclick="showModal('As time went on, I became more comfortable interacting with Spanish speakers, and making conversation with the kids whose school we ate lunch at was always a fun experience.'); showNextImage(this)">
            <img src="adol_images/a23.jpg" alt="Adolescent Photo"
                onclick="showModal('Though there were plenty of homesick moments...'); showNextImage(this)">
            <img src="adol_images/a36.jpeg" alt="Adolescent Photo"
                onclick="showModal('by the end of my time there, I was heartbroken to leave.'); showNextImage(this)">
            <img src="adol_images/a33.jpeg" alt="Adolescent Photo"
                onclick="showModal('Through my time in Spain, I learned how to navigate difficult situations with resilience, how to leave behind what no longer served me, and most importantly, how to find hope even in tough circumstances.'); showNextImage(this)">
            <img src="adol_images/a38.jpeg" alt="Adolescent Photo"
                onclick="showModal(' I learned that kindness, even in small gestures, can have an enormous impact on others.'); showNextImage(this)">
            <img src="adol_images/a39.jpeg" alt="Adolescent Photo"
                onclick="showModal('And perhaps most of all, I learned that the only way to grow is to push yourself out of your comfort zone, even when you’re terrified.'); showNextImage(this)">
            <img src="adol_images/a31.jpeg" alt="Adolescent Photo"
                onclick="showModal('Looking back, I see how all of these experiences, these moments of growth, have shaped me into who I am today.'); showNextImage(this)">
            <img src="adol_images/a17.jpeg" alt="Adolescent Photo"
                onclick="showModal('From the high school halls to the cobblestone streets of Zaragoza, every part of my journey has been a lesson in perseverance, friendship, and self-discovery.'); showNextImage(this)">
            <img src="adol_images/a40.jpeg" alt="Adolescent Photo"
                onclick="showModal('The road ahead will no doubt be full of new challenges, but now I know—whatever comes next, I’ll be ready for it.'); showNextImage(this)">
        </div>
    </main>
</body>
</html>
